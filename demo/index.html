<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatMath Graphics demo</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --axis: #a8a29e; --curve: #2563eb; --cert: #0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #292524; --axis: #57534e; --curve: #60a5fa; --cert: #2dd4bf; } }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  input[type=text] { flex: 1; min-width: 200px; font: 16px ui-monospace, monospace; padding: 6px 8px; border: 1px solid var(--axis); border-radius: 6px; background: transparent; color: inherit; }
  .slider { display: grid; grid-template-columns: 2ch 1fr 9ch; gap: 8px; align-items: center; }
  .slider output { font-family: ui-monospace, monospace; text-align: right; }
  canvas { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 8px; touch-action: none; }
  #status { font-size: 13px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--axis); }
  #status.exact { color: var(--cert); border-color: var(--cert); }
  #zeros { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); }
  #err { color: #dc2626; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>RatMath Graphics</h1>
  <div class="row"><span>y =</span><input id="expr" type="text" value="a*sin(b*x) + c*x" spellcheck="false" autocomplete="off"><span id="status">…</span></div>
  <div id="err"></div>
  <div id="sliders"></div>
  <canvas id="plot" width="800" height="480"></canvas>
  <p id="zeros"></p>
  <p style="color:var(--muted);font-size:13px">While a slider moves you see a fast floating-point sketch. When it stops, every pixel column is recomputed with certified rational interval arithmetic: shaded cells are exactly the pixels the graph can touch. Slider values are exact rationals.</p>
</main>
<script type="module" src="./dist/main.js"></script>
</body>
</html>
